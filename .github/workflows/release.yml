name: Release AAB (Google Play)
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode (must be higher than the one on Google Play)'
        required: true
        default: '3'
      version_name:
        description: 'versionName'
        required: true
        default: '3.0'
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx vite build
      - run: npx cap add android
      - name: Firebase config (for push notifications)
        run: cp google-services.json android/app/google-services.json
      - run: npx cap sync android
      - name: App icons (from assets/)
        run: npx @capacitor/assets generate --android
      - name: Notification icon and colour
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp android-extras/ic_stat_notify.xml android/app/src/main/res/drawable/ic_stat_notify.xml
          sed -i 's#</application>#        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_notify" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@android:color/holo_green_dark" />\n    </application>#' android/app/src/main/AndroidManifest.xml
      - name: Allow notifications permission (Android 13+)
        run: sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ inputs.version_code }}/; s/versionName \"[^\"]*\"/versionName \"${{ inputs.version_name }}\"/" android/app/build.gradle
          grep -nE 'versionCode|versionName' android/app/build.gradle
      - name: Signing key (from GitHub Secrets)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then echo "Missing signing secrets"; exit 1; fi
          KS_B64=$(printf '%s' "$KS_B64" | tr -d '[:space:]')
          KS_PASS=$(printf '%s' "$KS_PASS" | tr -d '[:space:]')
          KEY_PASS=$(printf '%s' "$KEY_PASS" | tr -d '[:space:]')
          KEY_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "password length: ${#KS_PASS} / key password length: ${#KEY_PASS} / alias: $KEY_ALIAS"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" -alias "$KEY_ALIAS" > /dev/null 2>&1; then echo "::error::Keystore password or alias is wrong. Re-enter ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS"; exit 1; fi
          echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KS_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          cat >> android/app/build.gradle <<GRADLE

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KS_FILE"))
                      storePassword System.getenv("KS_PASS")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASS")
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.release }
              }
          }
          GRADLE
      - name: Build signed AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - name: Show signing certificate fingerprints
        run: keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -E 'Owner|SHA1|SHA256'
      - uses: actions/upload-artifact@v4
        with:
          name: dolar-iraq-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
